<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkshopManager - Dashboard</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logout-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 255, 255, 0.1);
            animation: glow 4s ease-in-out infinite;
        }

        .appointment-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            fill: #00ffff;
            animation: pulse 2s ease-in-out infinite;
        }

        .title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #ffffff;
            font-weight: 700;
        }

        .subtitle {
            color: #b0b0b0;
            margin-bottom: 40px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .navigate-button {
            display: inline-block;
            padding: 18px 50px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 15px 35px rgba(0, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
        }

        .navigate-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(0, 255, 255, 0.6);
        }

        .navigate-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .navigate-button:hover::before {
            left: 100%;
        }

        .navigate-button.loading {
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            transform: scale(0.95);
        }

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00ffff;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #b0b0b0;
            margin-top: 5px;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
            }
            50% { 
                transform: scale(1.05);
                filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.8));
            }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 255, 0.6); }
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px 20px;
            }
            
            .logo {
                font-size: 1.5rem;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 1.6rem;
            }
            
            .quick-stats {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">WorkshopManager</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <main class="main-content">
        <div class="container">
            <svg class="appointment-icon" viewBox="0 0 100 100">
                <rect x="15" y="25" width="70" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect x="15" y="25" width="70" height="15" fill="currentColor" opacity="0.3"/>
                <rect x="25" y="15" width="4" height="20" rx="2" fill="currentColor"/>
                <rect x="71" y="15" width="4" height="20" rx="2" fill="currentColor"/>
                <line x1="25" y1="45" x2="75" y2="45" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="25" y1="55" x2="75" y2="55" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="25" y1="65" x2="75" y2="65" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="25" y1="75" x2="75" y2="75" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="35" y1="40" x2="35" y2="80" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="45" y1="40" x2="45" y2="80" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="55" y1="40" x2="55" y2="80" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="65" y1="40" x2="65" y2="80" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <circle cx="30" cy="50" r="2" fill="#ff6b6b"/>
                <circle cx="40" cy="60" r="2" fill="#4ecdc4"/>
                <circle cx="60" cy="50" r="2" fill="#45b7d1"/>
                <circle cx="70" cy="70" r="2" fill="#96ceb4"/>
                <circle cx="65" cy="35" r="8" fill="currentColor" opacity="0.9"/>
                <path d="M65 30 L65 35 L68 38" stroke="#000" stroke-width="1.5" fill="none"/>
            </svg>
            
            <h1 class="title">Appointment Management</h1>
            <p class="subtitle">Access your workshop scheduling system with advanced booking management and real-time availability tracking.</p>
            
            <button class="navigate-button" onclick="navigateToAppointments()">
                Manage Appointments
            </button>
            
            <div class="quick-stats">
                <div class="stat-item">
                    <span class="stat-number">12</span>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-item">
                    <span class="stat-number">47</span>
                    <div class="stat-label">This Week</div>
                </div>
                <div class="stat-item">
                    <span class="stat-number">8</span>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function navigateToAppointments() {
            const button = document.querySelector('.navigate-button');
            button.classList.add('loading');
            button.textContent = 'Loading...';
            
            setTimeout(() => {
                // Navigate to appointments page
                window.location.href = '/appointment';
            }, 800);
        }

        function logout() {
            window.location.href = 'login.html';
        }
    </script>

</html>
